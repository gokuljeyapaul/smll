name: monorepo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ${{ vars.MONOREPO_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for merge-base project diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system TTS dependencies (espeak-ng for synthetic audio fixtures)
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - name: Detect changed projects and run their setup/test/demo/verify
        run: python3 .github/scripts/verify_changed_projects.py
      - name: Upload failure diagnostics (test traces, error snapshots, logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-diagnostics
          path: |
            projects/*/test-results/**
            projects/*/playwright-report/**
            projects/*/artifacts/**
            !projects/*/artifacts/video/**
          if-no-files-found: ignore
          retention-days: 7
