[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coaching-privacy"
version = "0.1.0"
description = "Offline non-generative coaching transcript privacy pipeline (synthetic PoC)"
requires-python = ">=3.11"

[project.scripts]
privacy-pipeline = "coaching_privacy.cli:main"
privacy-fixtures = "coaching_privacy.fixtures_cli:main"
privacy-eval = "coaching_privacy.eval_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "fast: no real model inference (Presidio/spaCy allowed)",
    "slow: real GLiNER/Whisper inference, CLI e2e or demo scripts",
]
# Deliberately NO `-m` in addopts: CI (scripts/test.sh) runs the full suite
# (fast or slow); `make test-fast` / `pytest -m fast` selects the fast lane.
