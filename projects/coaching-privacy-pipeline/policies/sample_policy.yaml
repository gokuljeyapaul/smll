# Illustrative, synthetic-only versioned policies. Not proof of legal/ICF compliance.
schema_version: '1.0'
purpose_policies:
  internal_coaching_analysis:
    version: 0.1-poc
    synthetic_only: true
    external_distribution_permitted: false
    requires_human_release_approval: false
    mandatory_stages:
    - real_pii_detector
    - context_rules
    - transformation
    - independent_validator
    - policy_gate
    direct_pii:
    - REPLACE
    - SUPPRESS
    quasi_identifiers:
    - GENERALIZE
    - SUPPRESS
    - REVIEW
    sensitive_experience: PRESERVE_IF_RELEVANT_ELSE_GENERALIZE_OR_REVIEW
    confirmed_residual_pii: BLOCKED
    high_risk_uncertainty: REVIEW_REQUIRED
    mandatory_stage_error: FAILED
    release_candidate_meaning: Synthetic validation passed for internal prototype
      only; not permission to share
  external_sharing:
    version: 0.1-poc
    synthetic_only: true
    external_distribution_permitted: false
    requires_human_release_approval: true
    mandatory_stages:
    - real_pii_detector
    - context_rules
    - transformation
    - independent_validator
    - policy_gate
    direct_pii:
    - SUPPRESS
    - REPLACE
    quasi_identifiers:
    - GENERALIZE
    - SUPPRESS
    - REVIEW
    sensitive_experience: GENERALIZE_IF_UNNECESSARY_OR_PRESERVE_ONLY_AFTER_HUMAN_REVIEW
    confirmed_residual_pii: BLOCKED
    high_risk_uncertainty: REVIEW_REQUIRED
    mandatory_stage_error: FAILED
    minimum_decision: REVIEW_REQUIRED
note: Reference policy only; the implementing agent must validate the actual YAML
  schema and block unknown or malformed policies.
asr_confidence:
  # I19-S1: ASR uncertainty thresholds (calibrated on fixtures/audio +
  # degraded clips; see docs/evidence/I19-S1/calibration.log).
  min_avg_logprob_floor: -0.9       # below this a segment is low-confidence
  no_speech_prob_ceiling: 0.5      # above this a segment may be silence
  compression_ratio_ceiling: 2.4  # above this repeats/garbage likely
  language_probability_floor: 0.5 # below this language detection is unstable
