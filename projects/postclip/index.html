<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- R2-2 (A42): the standard mobile viewport. The keyboard-open
         friendliness comes from the 100dvh shell sizing + the fluid
         layout (WebKit logs a console ERROR for the Chromium-only
         "interactive-widget" key — A01's no-console-errors gate wins,
         so the meta stays engine-clean). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Turn a screenshot of a post into clean, shareable text — privately, on your own device." />
    <meta name="theme-color" content="#101418" />
    <!-- S5 (A29): the strict CSP, verbatim from scripts/csp-policy.mjs (the
         single source of truth). The test build appends exactly one
         connect-src origin — the local model server — via vite.config.ts. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://huggingface.co; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PostClip</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
