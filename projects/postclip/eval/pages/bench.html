<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>postclip OCR bench</title>
<!-- Dev/test-only instrumented page. Never part of the production build (A29). -->
</head>
<body>
<p id="status">booting…</p>
<script type="module">
const params = new URLSearchParams(location.search);
const engine = params.get('engine') ?? 'tesseract-fast';
const statusEl = document.getElementById('status');

function setStatus(text) {
  statusEl.textContent = text;
  console.info(`[bench] ${text}`);
}

function fileToImageData(blob) {
  // Decode a PNG blob through an <img> and draw it on a canvas at natural size.
  const url = URL.createObjectURL(blob);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      resolve({ imageData: ctx.getImageData(0, 0, canvas.width, canvas.height), canvas });
    };
    img.onerror = (e) => reject(new Error(`image decode failed: ${e}`));
    img.src = url;
  });
}

// ---------------------------------------------------------------- tesseract --
async function runTesseract(langPath) {
  // Load the UMD bundle from the bench server (same files the app ships).
  await importScript('/node_modules/tesseract.js/dist/tesseract.min.js');
  const T = globalThis.Tesseract;
  const worker = await T.createWorker('eng', 1, {
    workerPath: '/ocr-assets/worker.min.js',
    corePath: '/ocr-assets/',
    langPath,
    workerBlobURL: false,
    errorHandler: () => {},
  });
  // Engine-name suffixes sweep real tesseract parameters (measured, not guessed):
  //   -psm4/-psm6: page segmentation mode (single column / single block)
  //   -dpi96/-dpi150: user_defined_dpi override
  const m = decodeURIComponent(location.search).match(/engine=([^&]*)/);
  const engineName = m ? m[1] : '';
  const psm = engineName.match(/-psm(\d+)/);
  const dpi = engineName.match(/-dpi(\d+)/);
  const params = {};
  if (psm) params.tessedit_pageseg_mode = String(Number(psm[1]));
  if (dpi) params.user_defined_dpi = String(Number(dpi[1]));
  if (Object.keys(params).length > 0) await worker.setParameters(params);
  const quality = langPath === '/ocr-assets/' ? 'fast' : 'best';
  const suffix = Object.entries(params).map(([k, v]) => `${k}:${v}`).join(',') || 'default';
  return {
    name: `tesseract.js 7 (${quality} traineddata, ${suffix})`,
    async recognize(blob) {
      const { data } = await worker.recognize(blob, {}, { text: true });
      return data.text;
    },
    async close() {
      await worker.terminate();
    },
  };
}

function importScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`failed to load ${src}`));
    document.head.appendChild(s);
  });
}

// ------------------------------------------------------------------- PP-OCR --
async function runPaddleOCR() {
  const ort = await import('/node_modules/onnxruntime-web/dist/ort.min.mjs');
  ort.env.wasm.wasmPaths = '/node_modules/onnxruntime-web/dist/';
  ort.env.wasm.numThreads = 1; // keep it deterministic in a headless page
  setStatus('ppocr: loading det/rec sessions');
  const det = await ort.InferenceSession.create('/ppocr/ch_PP-OCRv4_det.onnx', { executionMode: 'sequential' });
  const rec = await ort.InferenceSession.create('/ppocr/en_PP-OCRv4_rec.onnx', { executionMode: 'sequential' });
  const dict = (await (await fetch('/ppocr/en_dict.txt')).text())
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter((l) => l.length > 0);
  dict.unshift('blank'); // CTC blank at index 0
  setStatus(`ppocr: det inputs ${JSON.stringify(det.inputNames)} rec inputs ${JSON.stringify(rec.inputNames)}`);

  const IMAGENET_MEAN = [0.485, 0.456, 0.406];
  const IMAGENET_STD = [0.229, 0.224, 0.225];

  function toCHWTensor(imageData, mean, std) {
    const { width: w, height: h, data } = imageData;
    const out = new Float32Array(3 * h * w);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        for (let c = 0; c < 3; c++) {
          out[c * h * w + y * w + x] = (data[i + c] / 255 - mean[c]) / std[c];
        }
      }
    }
    return out;
  }

  function resizeImageData(imageData, w, h) {
    const src = document.createElement('canvas');
    src.width = imageData.width;
    src.height = imageData.height;
    src.getContext('2d').putImageData(imageData, 0, 0);
    const dst = document.createElement('canvas');
    dst.width = w;
    dst.height = h;
    const ctx = dst.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, 0, 0, w, h);
    return ctx.getImageData(0, 0, w, h);
  }

  async function detectBoxes(imageData) {
    // DB preprocessing: max side 960, dims multiple of 32, ImageNet norm.
    const limit = 960;
    const ratio = Math.min(limit / Math.max(imageData.width, imageData.height), 1);
    let w = Math.max(32, Math.round((imageData.width * ratio) / 32) * 32);
    let h = Math.max(32, Math.round((imageData.height * ratio) / 32) * 32);
    const resized = resizeImageData(imageData, w, h);
    const tensor = new ort.Tensor('float32', toCHWTensor(resized, IMAGENET_MEAN, IMAGENET_STD), [1, 3, h, w]);
    const output = await det.run({ [det.inputNames[0]]: tensor });
    const probs = output[det.outputNames[0]].data; // [1,1,h,w]
    const mask = new Uint8Array(h * w);
    for (let i = 0; i < h * w; i++) mask[i] = probs[i] > 0.3 ? 1 : 0;
    // Connected components -> bounding boxes (text here is axis-aligned).
    const seen = new Uint8Array(h * w);
    const boxes = [];
    const stack = [];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const start = y * w + x;
        if (!mask[start] || seen[start]) continue;
        stack.length = 0;
        stack.push(start);
        seen[start] = 1;
        let minX = x, maxX = x, minY = y, maxY = y, area = 0;
        while (stack.length > 0) {
          const idx = stack.pop();
          const cy = Math.floor(idx / w);
          const cx = idx % w;
          area++;
          if (cx < minX) minX = cx;
          if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy;
          if (cy > maxY) maxY = cy;
          const neighbors = [idx - 1, idx + 1, idx - w, idx + w];
          for (const n of neighbors) {
            if (n < 0 || n >= h * w) continue;
            if (n === idx - 1 && cx === 0) continue;
            if (n === idx + 1 && cx === w - 1) continue;
            if (!mask[n] || seen[n]) continue;
            seen[n] = 1;
            stack.push(n);
          }
        }
        if (area < 8) continue; // noise
        // DB unclip: expand the box by a border proportional to size.
        const width = maxX - minX + 1;
        const height = maxY - minY + 1;
        const border = Math.max(2, Math.round((Math.min(width, height) * 0.25)));
        boxes.push({
          x0: Math.max(0, minX - border),
          y0: Math.max(0, minY - border),
          x1: Math.min(w - 1, maxX + border),
          y1: Math.min(h - 1, maxY + border),
        });
      }
    }
    // Scale back to original image coordinates.
    const sx = imageData.width / w;
    const sy = imageData.height / h;
    const scaled = boxes.map((b) => ({
      x0: b.x0 * sx, y0: b.y0 * sy, x1: b.x1 * sx, y1: b.y1 * sy,
    }));
    // Reading order: group by vertical center bands, then left to right.
    scaled.sort((a, b) => {
      const ay = (a.y0 + a.y1) / 2;
      const by = (b.y0 + b.y1) / 2;
      if (Math.abs(ay - by) > Math.max(a.y1 - a.y0, b.y1 - b.y0) * 0.6) return ay - by;
      return a.x0 - b.x0;
    });
    return scaled;
  }

  function cropCanvas(canvas, box) {
    const x = Math.max(0, Math.floor(box.x0));
    const y = Math.max(0, Math.floor(box.y0));
    const w = Math.max(1, Math.ceil(box.x1) - x);
    const h = Math.max(1, Math.ceil(box.y1) - y);
    const out = document.createElement('canvas');
    out.width = w;
    out.height = h;
    out.getContext('2d').drawImage(canvas, x, y, w, h, 0, 0, w, h);
    return out;
  }

  async function recognizeBox(canvas, box) {
    const REC_H = 48;
    const REC_W = 320;
    const crop = cropCanvas(canvas, box);
    const aspect = crop.width / crop.height;
    const targetW = Math.min(REC_W, Math.max(10, Math.round(REC_H * aspect)));
    const resized = resizeImageData(
      crop.getContext('2d').getImageData(0, 0, crop.width, crop.height),
      targetW,
      REC_H,
    );
    const padded = new Float32Array(3 * REC_H * REC_W);
    const CHW = toCHWTensor(resized, [0.5, 0.5, 0.5], [0.5, 0.5, 0.5]);
    const plane = REC_H * REC_W;
    for (let c = 0; c < 3; c++) {
      padded.set(CHW.subarray(c * REC_H * targetW, c * REC_H * targetW + REC_H * targetW), c * plane);
    }
    const tensor = new ort.Tensor('float32', padded, [1, 3, REC_H, REC_W]);
    const output = await rec.run({ [rec.inputNames[0]]: tensor });
    const logits = output[rec.outputNames[0]];
    // logits.dims = [1, seq, classes] (or [seq, 1, classes]); CTC greedy decode.
    const dims = logits.dims;
    const seq = dims[dims.length - 2];
    const classes = dims[dims.length - 1];
    const data = logits.data;
    const blank = 0;
    let text = '';
    let prev = blank;
    for (let t = 0; t < seq; t++) {
      let best = blank;
      let bestVal = -Infinity;
      for (let c = 0; c < classes; c++) {
        const v = data[t * classes + c];
        if (v > bestVal) { bestVal = v; best = c; }
      }
      if (best !== blank && best !== prev) text += dict[best] ?? '';
      prev = best;
    }
    return text;
  }

  return {
    name: 'PP-OCRv4 (det+rec onnx, onnxruntime-web)',
    async recognize(blob) {
      const { imageData, canvas } = await fileToImageData(blob);
      const boxes = await detectBoxes(imageData);
      const lines = [];
      for (const box of boxes) {
        const text = await recognizeBox(canvas, box);
        if (text.trim().length > 0) lines.push(text.trim());
      }
      return lines.join('\n');
    },
    async close() {},
  };
}

// --------------------------------------------------------------------- main --
async function main() {
  setStatus(`starting engine ${engine}`);
  const impl =
    engine.startsWith('tesseract-fast') ? await runTesseract('/ocr-assets/') :
    engine.startsWith('tesseract-best') ? await runTesseract('/tessdata-best/') :
    engine === 'ppocr' ? await runPaddleOCR() :
    null;
  if (!impl) throw new Error(`unknown engine ${engine}`);
  setStatus(`engine ${engine} ready: ${impl.name}`);

  const manifest = await (await fetch('/fixtures/manifest.json')).json();
  const results = [];
  for (const img of manifest.images) {
    const t0 = performance.now();
    const blob = await (await fetch(`/fixtures/${img.file}`)).blob();
    const text = await impl.recognize(blob);
    const ms = Math.round(performance.now() - t0);
    results.push({ id: img.id, ms, text });
    setStatus(`${engine}: ${img.id} done in ${ms}ms (${text.length} chars)`);
  }
  await impl.close();
  const resourceBytes = performance
    .getEntriesByType('resource')
    .filter((r) => /ocr-assets|tessdata-best|ppocr|onnxruntime|tesseract/.test(r.name))
    .reduce((sum, r) => sum + (r.encodedBodySize || r.transferSize || 0), 0);
  document.getElementById('status').textContent = 'done';
  window.__benchDone = true;
  window.__benchResults = { engine, name: impl.name, resourceBytes, results };
  console.info(`[bench] ${engine} complete`);
}

main().catch((err) => {
  document.getElementById('status').textContent = `error: ${String(err)}`;
  console.error(`[bench] ${engine} failed:`, err);
  window.__benchError = String(err);
  window.__benchDone = true;
});
</script>
</body>
</html>
